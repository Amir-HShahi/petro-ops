name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    # Ports match the defaults in .env.example, so the tests need no extra settings.
    services:
      postgres:
        image: postgres:17.11-alpine
        env:
          POSTGRES_USER: petro_ops
          POSTGRES_PASSWORD: petro_ops
          POSTGRES_DB: petro_ops
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U petro_ops -d petro_ops"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:4.4.0-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: petro_ops
          RABBITMQ_DEFAULT_PASS: petro_ops
          # Queue counts refresh every second, so the queue-monitor tests wait less.
          RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit collect_statistics_interval 1000"
        ports:
          - 127.0.0.1:5672:5672
          - 127.0.0.1:15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 5s --health-timeout 10s --health-retries 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked

      # The DOC tests convert files with LibreOffice.
      - name: Install LibreOffice
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer

      - name: Pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Import layers
        run: uv run lint-imports

      # Adapters are covered by integration tests, so the coverage gate is measured
      # on both suites together. Slow tests need Docling and Ollama models, which CI
      # does not download, so they are left out.
      - name: Unit and integration tests
        run: uv run pytest tests/unit tests/integration -m "not slow" --cov-fail-under=80

      - name: Released prompts are unchanged
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only --diff-filter=MDR \
            "origin/$BASE_REF...HEAD" -- prompts \
            | grep -E '^prompts/.+/v[0-9]+\.md$' || true)
          if [ -n "$changed" ]; then
            echo "Released prompt versions must not change. Add a new version instead:"
            echo "$changed"
            exit 1
          fi
