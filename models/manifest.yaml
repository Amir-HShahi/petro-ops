# Local models used by the core, one entry per role.
# Weights are not in git. Get them with the command in `source`.
# `digest` comes from `ollama list`; `context_tokens`, `dimensions` and
# `quantization` come from `ollama show <name>:<tag>`.
# Prompts pick a model by `role`, see prompts/registry.yaml.
# Decision records: docs/adr/0001-local-models-and-runtime.md and
# docs/adr/0002-lvm-ocr-and-document-parsers.md
models:
  - role: llm
    name: gemma4
    tag: 12b-it-qat
    runtime: ollama
    source: ollama pull gemma4:12b-it-qat
    digest: 38044be4f923
    quantization: Q4_0
    context_tokens: 262144
    # Used on every call unless a task in prompts/registry.yaml overrides them.
    # Zero temperature and a fixed seed make the same input give the same output.
    # Gemma thinks by default; the benchmark in ADR 0001 ran with thinking off.
    default_params:
      temperature: 0
      seed: 42
      is_thinking_enabled: false
      context_tokens: 8192
      max_output_tokens: 1024
    status: chosen

  - role: embedding
    name: embeddinggemma
    tag: 300m
    runtime: ollama
    source: ollama pull embeddinggemma:300m
    digest: 85462619ee72
    quantization: BF16
    context_tokens: 2048
    dimensions: 768
    status: chosen

  # The same weights as the llm role, so the LVM needs no extra memory.
  - role: lvm
    name: gemma4
    tag: 12b-it-qat
    runtime: ollama
    source: ollama pull gemma4:12b-it-qat
    digest: 38044be4f923
    quantization: Q4_0
    context_tokens: 262144
    # A scanned page costs about 1,000 image tokens; a dense table needs a long answer.
    default_params:
      temperature: 0
      seed: 42
      is_thinking_enabled: false
      context_tokens: 8192
      max_output_tokens: 4096
    status: chosen

  # Required cross-check for tables on scanned pages (ADR 0002).
  # `latest` can move; the digest pins the tested weights.
  - role: ocr
    name: glm-ocr
    tag: latest
    runtime: ollama
    source: ollama pull glm-ocr:latest
    digest: 89d735dd9c07
    quantization: F16
    context_tokens: 131072
    # A page costs about 2,800 image tokens here.
    default_params:
      temperature: 0
      context_tokens: 8192
      max_output_tokens: 4096
    status: chosen

  - role: reranker
    name: bge-reranker-v2-m3
    tag: latest
    runtime: ollama
    source: ollama pull qllama/bge-reranker-v2-m3:latest
    digest: 06e0e64a6f61
    quantization: Q8_0
    context_tokens: 8192
    dimensions: 1024
    status: chosen
